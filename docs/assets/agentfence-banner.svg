<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">AgentFence</title>
  <desc id="desc">A geometric shield and terminal boundary mark beside the AgentFence name and local-first security scanner tagline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1f35"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <path d="M0 250C190 180 320 304 512 246C708 188 838 219 1280 118V320H0Z" fill="#0f766e" opacity="0.13"/>
  <path d="M0 78C226 132 370 26 588 78C806 130 1034 38 1280 70" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.16"/>

  <g opacity="0.22" stroke="#7dd3fc" stroke-width="1">
    <path d="M44 36v248M84 36v248M124 36v248M164 36v248M204 36v248M244 36v248M284 36v248M324 36v248"/>
    <path d="M28 72h324M28 112h324M28 152h324M28 192h324M28 232h324M28 272h324"/>
  </g>

  <g transform="translate(72 42)">
    <path d="M110 0L204 34V104C204 166 168 211 110 236C52 211 16 166 16 104V34L110 0Z" fill="#081827" stroke="url(#shield)" stroke-width="6" filter="url(#glow)"/>
    <path d="M110 24L180 49V103C180 146 156 178 110 199C64 178 40 146 40 103V49L110 24Z" fill="#0b2433" stroke="#38bdf8" stroke-width="2" opacity="0.95"/>
    <path d="M70 78l-20 24l20 24M150 78l20 24l-20 24" fill="none" stroke="#67e8f9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M91 132h38" stroke="#22c55e" stroke-width="8" stroke-linecap="round"/>
    <path d="M82 47v112M110 47v112M138 47v112" stroke="#94a3b8" stroke-width="3" opacity="0.34"/>
  </g>

  <g transform="translate(360 70)">
    <text x="0" y="72" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="66" font-weight="700" letter-spacing="-2">AgentFence</text>
    <rect x="2" y="96" width="664" height="2" fill="url(#shield)"/>
    <text x="0" y="139" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25">Local-first security scanner for AI coding-agent environments</text>
    <g transform="translate(0 166)">
      <rect width="644" height="48" rx="10" fill="#020617" stroke="#334155"/>
      <circle cx="22" cy="24" r="5" fill="#22c55e"/>
      <text x="42" y="31" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">scan locally  ·  execute nothing  ·  report safely</text>
    </g>
  </g>

  <g transform="translate(1128 250)" fill="none" stroke="#67e8f9" stroke-width="2" opacity="0.48">
    <circle cx="0" cy="0" r="8" fill="#67e8f9"/>
    <circle cx="44" cy="0" r="8"/>
    <circle cx="88" cy="0" r="8"/>
    <path d="M8 0h28M52 0h28"/>
  </g>
</svg>
